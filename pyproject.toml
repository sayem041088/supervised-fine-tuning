[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-supervised-fine-tuning"
version = "1.0.0"
description = "Production-grade Supervised Fine-Tuning (SFT) pipeline for Gemini models on Google Cloud Vertex AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Abu Sadat Mohammad Sayem", email = "sayem.eee04@gmail.com" }
]
keywords = ["llm", "fine-tuning", "gemini", "vertex-ai", "nlp", "summarization", "rouge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "google-genai>=0.1.0",
  "google-cloud-aiplatform>=1.38.0",
  "google-cloud-storage>=2.14.0",
  "vertexai>=1.38.0",
  "rouge-score>=0.1.2",
  "pandas>=2.0.0",
  "jsonlines>=3.1.0",
  "numpy>=1.26.0,<2.6",
  "pyyaml>=6.0",
  "tabulate>=0.9.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0",
  "pre-commit>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra -q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
]
ignore = [
  "E501", # Line length (handled by formatter)
  "B008", # Do not perform function call in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
